[package]
name = "rkusb"
version = "0.5.0"
edition = "2024"
authors = ["Tnze <Tnze@tnze.tech>"]
license = "GPL-2.0"
description = "Library for communicating with Rockchip devices over USB"

[dependencies]
rkafp = "0.1.3"
crc = "3.4"
log = "0.4"
rusb = "0.9"
thiserror = "2.0"
humansize = "2.1"
zerocopy = { version = "0.8", features = ["derive", "simd"] }
rand = "0.10"
hex = "0.4"
rc4 = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_WinRT",
    "Win32_System_IO",
], optional = true }

[features]
default = ["rockusb"]
rockusb = ["dep:windows"]
vendored = ["rusb/vendored"]
