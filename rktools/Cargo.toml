[package]
name = "rktools"
version = "0.5.0"
edition = "2024"
authors = ["Tnze <Tnze@tnze.tech>", "IFLYTEK-LEAKING", "KawaiiSparkle"]
license = "GPL-3.0-or-later"
description = "CLI tools for manipulating Rockchip devices (rktools + nolimit + splsim)"

[[bin]]
name = "rktools"
path = "src/main.rs"

[dependencies]
rkusb = { path = "../rkusb" }
clap = { version = "4.6", features = ["derive"] }
crc = "3.4"
crc32fast = "1.4"
env_logger = "0.11"
humantime = "2.3"
humansize = "2.1"
log = "0.4"
memmap2 = "0.9"
rusb = "0.9"
thiserror = "2.0"
rkafp = "0.1.3"
rc4 = "0.2"
zerocopy = { version = "0.8", features = ["derive", "simd"] }
hex = "0.4"
gpt = { version = "4.1", features = ["log"] }
sha2 = "0.10"
md-5 = "0.10"
flate2 = "1.1"
regex = "1.11"
